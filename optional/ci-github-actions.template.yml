# Continuous checks — re-runs tests, secret scans, and WORKLOG verification automatically.
# Copy to `.github/workflows/ci.yml`.
#
# Cost & runner notes:
#   - `push` fires only on `main`. Using ["**"] would double-bill every PR branch push.
#   - Keep jobs on Linux (ubuntu-latest) unless Windows/macOS is required for tests.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Replace the steps below with your project's test setup commands.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Example setup steps:
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      # - run: npm ci
      # - run: npm test

  # Backstop behind local lefthook gitleaks run.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  # Enforce AGENTS.md requirement that PRs update WORKLOG.md.
  worklog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require a WORKLOG entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(gh pr view ${{ github.event.pull_request.number }} --json files -q '.files[].path')
          echo "Files changed in this PR:"
          echo "$files"
          if echo "$files" | grep -qx 'WORKLOG.md'; then
            echo "WORKLOG.md updated."
          else
            echo "::error::This PR does not touch WORKLOG.md. AGENTS.md requires a dated entry describing what changed, which branch, and what's next."
            exit 1
          fi
