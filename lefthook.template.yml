# Lefthook — runs quick checks automatically before each commit.
#
# Install once:
#   1. Get lefthook:  https://github.com/evilmartians/lefthook  (`scoop install lefthook`)
#   2. Get gitleaks:  https://github.com/gitleaks/gitleaks  (`scoop install gitleaks`)
#   3. Copy this file to your repo root as `lefthook.yml`, then run:  lefthook install
#
# After that, every `git commit` runs these checks first and aborts if any fail.

pre-commit:
  parallel: true
  commands:
    # Branch guard at the git level, so it applies to EVERY agent (Claude, Codex, Cursor,
    # Antigravity) and to manual commits — not just Claude's hook. Refuses commits on main.
    no-commit-on-main:
      run: pwsh -NoProfile -Command "$b = (git rev-parse --abbrev-ref HEAD).Trim(); if ($b -in 'main','master') { Write-Host 'Refused: commit on '$b'. Branch first: git switch -c <type>/<short-desc>'; exit 1 }"

    # The most important guardrail: refuse to commit secrets (keys, tokens, passwords).
    secret-scan:
      run: gitleaks protect --staged --redact --config .gitleaks.toml

    # Catch giant files before they pollute history. Adjust the size as needed.
    no-large-files:
      run: git diff --cached --name-only --diff-filter=A
      # Lefthook passes staged files; see docs to add a size check script if you want one.

    # --- Wire your project's own checks below. Uncomment and edit. ---
    # lint:
    #   glob: "*.{js,ts,py,go}"
    #   run: <your linter, e.g. ruff check {staged_files} / eslint {staged_files}>
    # format-check:
    #   run: <your formatter in check mode, e.g. prettier --check {staged_files}>

# Optional: also run the secret scan and tests before pushing.
# pre-push:
#   commands:
#     test:
#       run: <your test command>
